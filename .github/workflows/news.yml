# Refreshes the News page every three hours from the stories approved in
# the ShiftNG app. Commits only when the stories have changed.
name: Refresh news

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # ref: main, so a run that waited in the queue starts from the newest news,
      # not from the commit it was queued on (that caused a rebase conflict on 14 Nov).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build data/news.json and commit if it changed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          git config user.name "shiftng-news-bot"
          git config user.email "shiftng-news-bot@users.noreply.github.com"
          # news.json is rebuilt whole from the database, so if someone pushed
          # meanwhile we start again from their commit instead of merging.
          for attempt in 1 2 3; do
            node scripts/build-news.mjs
            if [ -z "$(git status --porcelain data/news.json)" ]; then echo "No change."; exit 0; fi
            git add data/news.json
            git commit -q -m "Refresh news"
            git push -q && exit 0
            echo "Push attempt $attempt failed; starting again from the newest commit."
            sleep $((attempt * 10))
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
